name: Vortex Engine - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Vortex Engine
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Check project
        shell: bash
        run: |
          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== WWW ====="
          if [ -d "www" ]; then
            ls -la www
          else
            echo "WARNING: www folder not found"
          fi

      - name: Create package.json if missing
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "package.json not found - creating one..."

            cat > package.json <<'EOF'
          {
            "name": "vortex-engine",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Vortex Engine"
            },
            "dependencies": {
              "@capacitor/core": "^6.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF
          fi

      - name: Install Capacitor
        shell: bash
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare web folder
        shell: bash
        run: |
          if [ ! -d "www" ]; then
            mkdir -p www

            if [ -f "index.html" ]; then
              cp index.html www/index.html
            else
              echo "ERROR: No index.html or www/index.html found"
              exit 1
            fi
          fi

      - name: Create Capacitor config if missing
        shell: bash
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vortexengine.game",
            "appName": "Vortex Engine",
            "webDir": "www"
          }
          EOF
          fi

      - name: Add Android platform
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Upload Vortex APK
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Engine-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
