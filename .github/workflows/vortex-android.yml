name: Vortex Engine - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Vortex Android APK
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. دریافت Repository
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      # -----------------------------
      # 3. Java 17
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------
      # 4. پیدا کردن فایل Vortex
      # -----------------------------
      - name: Find Vortex HTML
        shell: bash
        run: |

          echo "======================================"
          echo " Searching for Vortex HTML"
          echo "======================================"

          mkdir -p www

          FOUND=""

          # HTML واقعی
          FOUND=$(find . \
            -type f \
            \( \
              -iname "*.html" \
              -o -iname "*.htm" \
            \) \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            | head -n 1)

          # اگر فایل با .html.txt ذخیره شده باشد
          if [ -z "$FOUND" ]; then
            FOUND=$(find . \
              -type f \
              -iname "*.html.txt" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | head -n 1)
          fi

          # اگر پیدا شد
          if [ -n "$FOUND" ]; then

            echo "HTML FOUND:"
            echo "$FOUND"

            cp "$FOUND" www/index.html

          else

            echo ""
            echo "======================================"
            echo " NO HTML FILE FOUND"
            echo "======================================"
            echo ""

            echo "Files in repository:"
            find . \
              -type f \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | head -n 200

            echo ""
            echo "======================================"
            echo "ERROR"
            echo "======================================"
            echo "Upload your Vortex Engine HTML file"
            echo "to the repository."
            echo ""

            exit 1
          fi

          echo ""
          echo "Web directory:"
          ls -lah www

      # -----------------------------
      # 5. ساخت package.json
      # -----------------------------
      - name: Create package.json
        shell: bash
        run: |

          if [ ! -f package.json ]; then

            cat > package.json <<'EOF'
          {
            "name": "vortex-engine",
            "version": "1.0.0",
            "private": true
          }
          EOF

          fi

      # -----------------------------
      # 6. نصب Capacitor
      # -----------------------------
      - name: Install Capacitor
        shell: bash
        run: |

          npm install \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

      # -----------------------------
      # 7. تنظیم Capacitor
      # -----------------------------
      - name: Create Capacitor Config
        shell: bash
        run: |

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vortexengine.game",
            "appName": "Vortex Engine",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      # -----------------------------
      # 8. ساخت پروژه Android
      # -----------------------------
      - name: Add Android Platform
        shell: bash
        run: |

          npx cap add android

      # -----------------------------
      # 9. Sync
      # -----------------------------
      - name: Sync Capacitor
        shell: bash
        run: |

          npx cap sync android

      # -----------------------------
      # 10. دسترسی Gradle
      # -----------------------------
      - name: Make Gradle Executable
        shell: bash
        run: |

          chmod +x android/gradlew

      # -----------------------------
      # 11. ساخت APK
      # -----------------------------
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # -----------------------------
      # 12. نمایش APK
      # -----------------------------
      - name: Check APK
        shell: bash
        run: |

          echo "======================================"
          echo " APK FILES"
          echo "======================================"

          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      # -----------------------------
      # 13. آپلود APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Engine-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
