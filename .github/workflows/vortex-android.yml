name: Vortex Engine - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Vortex Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Vortex HTML
        shell: bash
        run: |
          echo "Searching for HTML game..."

          FOUND=$(find . \
            -type f \
            -iname "*.html" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            | head -n 1)

          if [ -z "$FOUND" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: No HTML game was found!"
            echo "======================================"
            echo ""
            echo "Upload your Vortex Engine HTML file"
            echo "to the GitHub repository first."
            echo ""
            exit 1
          fi

          echo "Found:"
          echo "$FOUND"

          mkdir -p www

          cp "$FOUND" www/index.html

          echo ""
          echo "Vortex game copied to:"
          echo "www/index.html"

      - name: Create package.json
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "vortex-engine",
            "version": "1.0.0",
            "private": true
          }
          EOF
          fi

      - name: Install Capacitor
        shell: bash
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Capacitor configuration
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vortexengine.game",
            "appName": "Vortex Engine",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        shell: bash
        run: |
          npx cap add android

      - name: Sync Android
        shell: bash
        run: |
          npx cap sync android

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Engine-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
